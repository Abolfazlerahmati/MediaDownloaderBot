# MediaDownloaderBot on Cloudflare Workers (free plan: no Containers, no Durable Objects).
# Secrets are NOT stored here. Set them in the Cloudflare dashboard (Workers & Pages > mediadownloaderbot >
# Settings > Variables and secrets, type "Secret"), never in this file:
#   BOT_TOKEN       Telegram bot token from @BotFather
#   WEBHOOK_SECRET  any random string (>= 32 chars); Telegram echoes it in each webhook call
name = 'mediadownloaderbot'
main = "src/index.ts"
compatibility_date = "2026-10-13"

# Cloudflare D1 database. The name and id must match the existing database.
[[d1_databases]]
binding = "DB"
database_name = "mediabot"
database_id = "cb32937c-110c-4621-a236-0f7f6a8b7b2f"

# KV namespace bound as CACHE. Declared for future use; the application does not read or write it yet.
[[kv_namespaces]]
binding = "CACHE"
id = "c22c95c3c6ae40a88fbcd4d52c8a5471"

# Gives the running Worker's version id and upload time to the panel (Diagnostics), so an update can be checked.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Static files for the admin panel (public/static/app.css and app.js).
[assets]
directory = "./public"
binding = "ASSETS"

# Hourly maintenance: prunes old logs (per the retention setting), rate and dedupe rows, and expired sessions.
[triggers]
crons = ["0 * * * *"]
