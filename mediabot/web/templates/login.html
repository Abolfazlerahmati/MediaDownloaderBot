<!doctype html>
<html lang="en" dir="ltr" data-theme="{{ appearance.theme }}" data-mode="{{ appearance.mode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in · MediaDownloaderBot</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/themes/{{ appearance.theme }}.css" id="theme-css">
  <link rel="icon" href="data:,">
</head>
<body class="login-body" data-page="login">
  <main class="login-card card" id="view">
    <div class="brand brand-center">
      <span class="brand-mark" aria-hidden="true">MD</span>
      <div class="brand-text"><strong>MediaDownloaderBot</strong><small>Administrator sign in</small></div>
    </div>
    <form id="login-form" class="form" novalidate>
      <div class="field" data-field="username">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required maxlength="64" autofocus>
        <p class="field-msg" role="alert"></p>
      </div>
      <div class="field" data-field="password">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="512">
        <p class="field-msg" role="alert"></p>
      </div>
      <p class="form-error" role="alert" hidden></p>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
    <p class="muted small center">Sessions expire automatically. Use HTTPS in production.</p>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/js/common.js" defer></script>
  <script src="/static/js/pages/login.js" defer></script>
</body>
</html>
