<!doctype html>
<html lang="en" dir="ltr" data-theme="{{ appearance.theme }}" data-mode="{{ appearance.mode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ title }} · MediaDownloaderBot</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/themes/{{ appearance.theme }}.css" id="theme-css">
  <link rel="icon" href="data:,">
</head>
<body data-page="{{ page }}">
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">MD</span>
        <div class="brand-text"><strong>MediaDownloaderBot</strong><small>Admin panel</small></div>
      </div>
      <nav class="nav" aria-label="Main navigation">
        {% for key, href, label in nav %}
        <a class="nav-link" href="{{ href }}" data-nav="{{ key }}"{% if key == page %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
      <div class="sidebar-foot">
        <span class="pill" title="Persistence mode">{{ persistence_mode }}</span>
        <span class="muted small">v{{ version }}</span>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1 class="page-title">{{ title }}</h1>
        <div class="top-actions">
          <button class="btn ghost small" type="button" data-action="mode" aria-label="Change appearance mode">
            Mode: <span data-mode-label>{{ appearance.mode }}</span>
          </button>
          <span class="user-chip" title="Signed in as">{{ admin.username }}</span>
          <button class="btn ghost small" type="button" data-action="logout">Sign out</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/js/common.js" defer></script>
  <script src="/static/js/pages/{{ script }}.js" defer></script>
</body>
</html>
