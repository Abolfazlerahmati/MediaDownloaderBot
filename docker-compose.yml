# NOTE: untested in the authoring sandbox (no Docker daemon). See docs/deployment.md.
services:
  app:
    build: .
    image: mediabot:1.0.0
    restart: unless-stopped          # restarts the process after a panel-initiated restart (exit 75)
    env_file: .env                   # APP_SECRET_KEY, optional BOT_TOKEN, etc. Never commit .env
    environment:
      DATA_DIR: /data
      ADMIN_HOST: 0.0.0.0            # inside the container only; published on localhost below
      RESTART_SUPERVISED: "true"
    ports:
      - "127.0.0.1:8080:8080"        # admin panel reachable only from the host; put a TLS proxy in front
    volumes:
      - ./data:/data                 # SQLite database and temporary files
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g

  # Optional: public HTTPS for Telegram webhooks on a Cloudflare FREE account (no Workers plan needed).
  # Start with:  docker compose --profile tunnel up -d
  # Requires deploy/cloudflared/config.yml and the tunnel credentials file (see docs/cloudflare-free.md).
  # Only /telegram/webhook is routed to the app; all other paths get 404 from cloudflared.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    depends_on:
      - app
    volumes:
      - ./deploy/cloudflared:/etc/cloudflared:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
